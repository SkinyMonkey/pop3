[workspace]
members = ["crates/pop3-data", "crates/pop3-engine", "crates/pop3-render"]

[workspace.dependencies]
wgpu = "28.0"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18.0"
image = "0.24.3"
num-traits = "0.2.15"
clap = "4.0.14"
log = "0.4.17"
env_logger = "0.10.0"
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
mlua = { version = "0.11", features = ["lua54", "vendored"] }
dirs = "6"

[package]
name = "pop3"
version = "0.1.0"
edition = "2021"
default-run = "pop3"

[dependencies]
pop3-data = { path = "crates/pop3-data" }
pop3-engine = { path = "crates/pop3-engine" }
pop3-render = { path = "crates/pop3-render" }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
bytemuck = { workspace = true }
cgmath = { workspace = true }
image = { workspace = true }
num-traits = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
